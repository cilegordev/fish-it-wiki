<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="All Fish It baits with luck, bonuses, and how to get them."><meta name="theme-color" content="#06121a">
<title>Baits - Fish It Wiki</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎣</text></svg>">

<link rel="stylesheet" href="style.css"></head><body data-page="baits">
<template id="c">
<h1>Baits</h1>
<div id="toc" class="tabs" aria-label="Loncat ke bait"></div>
<div id="rods"></div>
</template>
<script src="data.js"></script><script src="site.js"></script>
<script src="cards.js"></script>
<script>
const statRows=r=>stat("Luck",r.luck)+toArr(r.bonus).concat(toArr(r.stats)).map(v=>{const p=splitStat(v,"Bonus");return stat(p.label,p.value)}).join("");
document.getElementById("toc").innerHTML=tocHTML(BAITS);
document.getElementById("rods").innerHTML=BAITS.map(r=>cardHTML(r,{imgDir:IMG.bait,noun:"bait",stats:statRows(r)})).join("");
</script></body></html>
