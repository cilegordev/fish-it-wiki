<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="All Fish It rods with luck, speed, max weight, unique stats, and how to get them."><meta name="theme-color" content="#06121a">
<title>Rods - Fish It Wiki</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎣</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body data-page="rods">
<template id="c">
<h1>Rods</h1>
<div id="toc" class="tabs" aria-label="Loncat ke rod"></div>
<div id="rods"></div>
</template>
<script src="data.js"></script><script src="site.js"></script>
<script src="cards.js"></script>
<script>
const statRows=r=>stat("Luck",r.luck)+stat("Speed",r.speed)+stat("Max Weight",r.weight)
 +toArr(r.stats).map(v=>{const p=splitStat(v,"Unique Stat");return stat(p.label,p.value,"stk")}).join("");
document.getElementById("toc").innerHTML=tocHTML(RODS);
document.getElementById("rods").innerHTML=RODS.map(r=>cardHTML(r,{imgDir:IMG.rod,noun:"rod",stats:statRows(r)})).join("");
</script></body></html>
